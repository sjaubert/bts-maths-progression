<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD06 Simulateur équations différentielles</title>
<meta name="description" content="Simulations physiques pour visualiser les équations différentielles du premier et du second ordre (BTS, Bachelor). Pôle Formation UIMM Centre-Val de Loire.">
<style>
:root{
  --bleu:#005C85; --bleu2:#169BD6; --rouge:#D31326; --clair:#E8F1F8; --orange:#E8871E;
  --vert:#2E8B57; --gris:#595959; --gris2:#8a94a0; --ligne:#c9d6e2; --fond:#f4f7fa; --carte:#ffffff; --texte:#1d2630;
  --rayon:8px; --fs:15px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--fond);color:var(--texte);font-family:Calibri,"Segoe UI",Carlito,Arial,sans-serif;line-height:1.35}
body.proj{--fs:19px}
button,select,input{font:inherit;color:inherit}
header.top{background:var(--bleu);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
header.top .logo{font-weight:700;letter-spacing:.5px;background:#fff;color:var(--bleu);border-radius:4px;padding:2px 8px;font-size:.9rem}
header.top h1{font-size:1.15rem;margin:0;font-weight:600}
header.top .sp{flex:1}
header.top button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
header.top button:hover,header.top button.on{background:rgba(255,255,255,.18)}
nav.tabs{background:#fff;border-bottom:1px solid var(--ligne);display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px;align-items:center}
nav.tabs .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav.tabs .grp>span{font-size:.8rem;color:var(--gris);text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
nav.tabs button{border:1px solid var(--ligne);background:var(--clair);border-radius:16px;padding:3px 11px;cursor:pointer;font-size:.92rem}
nav.tabs button .n{font-weight:700;color:var(--bleu);margin-right:5px}
nav.tabs button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
nav.tabs button.on .n{color:#fff}
main{padding:12px 16px 30px;max-width:1700px;margin:0 auto}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--rayon);padding:10px 12px}
.titrebar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.titrebar h2{margin:0;font-size:1.35rem;color:var(--bleu)}
.titrebar .niv{font-size:.82rem;background:var(--clair);border:1px solid var(--ligne);border-radius:10px;padding:1px 8px;color:var(--gris)}
.titrebar select{border:1px solid var(--ligne);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(300px,0.85fr) 1.35fr;gap:12px}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.animbox{position:relative;padding:0;overflow:hidden}
.animbox canvas{display:block;width:100%;height:330px}
body.proj .animbox canvas{height:390px}
.animbox .clock{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.88);border:1px solid var(--ligne);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums;font-size:.95rem}
.ctrl h3,.info h3{margin:0 0 6px;font-size:1rem;color:var(--bleu)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.presets button{border:1px solid var(--bleu2);background:#fff;color:var(--bleu);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:.88rem}
.presets button:hover{background:var(--clair)}
.prm{display:grid;grid-template-columns:minmax(120px,1.1fr) 1.6fr minmax(86px,auto);align-items:center;gap:4px 10px;padding:3px 0;border-bottom:1px dashed #e3eaf1}
.prm:last-child{border-bottom:0}
.prm label{font-size:.93rem}
.prm label .u{color:var(--gris);font-size:.85rem}
.prm input[type=range]{width:100%;accent-color:var(--bleu)}
.prm .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;color:var(--bleu);white-space:nowrap}
.prm .val input{width:86px;text-align:right;border:1px solid var(--ligne);border-radius:4px;padding:1px 4px;font-weight:600;color:var(--bleu)}
.prm select{width:100%;border:1px solid var(--ligne);border-radius:5px;padding:2px 4px;background:#fff}
.prm.cache .val{color:var(--rouge)}
.prm.off{display:none}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.92rem}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sep{width:1px;height:24px;background:var(--ligne);margin:0 2px}
.btn{border:1px solid var(--ligne);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--clair)}
.btn.prim{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn.prim:hover{background:#0b6d9b}
.btn.on{background:var(--clair);border-color:var(--bleu);color:var(--bleu);font-weight:600}
.btn.defi.on{background:#fde8ea;border-color:var(--rouge);color:var(--rouge)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toolbar select{border:1px solid var(--ligne);border-radius:6px;padding:4px 6px;background:#fff;max-width:270px}
.toolbar .lab{font-size:.85rem;color:var(--gris)}
.graphbox{padding:0;position:relative}
.graphbox canvas{display:block;width:100%;height:400px;touch-action:none}
body.proj .graphbox canvas{height:470px}
.subbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.9rem;padding:6px 10px;border-top:1px solid var(--ligne);background:#fafcfe;border-radius:0 0 var(--rayon) var(--rayon)}
.subbar .grow{flex:1}
.subbar input[type=range]{width:140px;accent-color:var(--rouge)}
.mesure{font-variant-numeric:tabular-nums;color:var(--texte)}
.mesure b{color:var(--bleu)}
.info{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.info>*{min-width:0}
@media (max-width:760px){.info{grid-template-columns:minmax(0,1fr)}}
.eq .ligne{margin:4px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.eq .ligne .t{font-size:.8rem;color:var(--gris);display:block}
math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Libertinus Math",math;font-size:1.12em}
math[display=block]{margin:2px 0}
table.carac{width:100%;border-collapse:collapse;font-size:.93rem}
table.carac td{padding:3px 4px;border-bottom:1px solid #edf2f7;vertical-align:top}
table.carac td:last-child{text-align:right;font-weight:600;color:var(--bleu);white-space:nowrap;font-variant-numeric:tabular-nums}
table.carac tr.regime td:last-child{color:var(--rouge)}
.alerte{background:#fff6e5;border:1px solid #f0c27a;border-radius:6px;padding:5px 8px;font-size:.9rem;margin-top:6px}
.defipanel{border:2px solid var(--rouge);background:#fff7f8}
.defipanel h3{color:var(--rouge)}
.defipanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.defipanel input{width:120px;border:1px solid var(--ligne);border-radius:5px;padding:3px 6px}
.defipanel .rep{margin-top:6px;font-weight:600}
.defipanel .rep.ok{color:var(--vert)} .defipanel .rep.ko{color:var(--rouge)}
details.card summary{cursor:pointer;font-weight:600;color:var(--bleu)}
details.card ol,details.card ul{margin:6px 0 2px;padding-left:22px}
details.card li{margin:3px 0}
.ctx p{margin:6px 0}
.ctx .src{font-size:.88rem;color:var(--gris)}
table.analog{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:6px}
table.analog th,table.analog td{border:1px solid var(--ligne);padding:3px 6px;text-align:left}
table.analog th{background:var(--clair);color:var(--bleu)}
.accueil{max-width:1100px;margin:0 auto}
.accueil h2{color:var(--bleu);margin:6px 0 8px}
.accueil .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0}
.accueil .cartes button{text-align:left;border:1px solid var(--ligne);background:#fff;border-radius:var(--rayon);padding:10px;cursor:pointer}
.accueil .cartes button:hover{border-color:var(--bleu);background:var(--clair)}
.accueil .cartes b{color:var(--bleu)}
.accueil .cartes small{display:block;color:var(--gris);margin-top:3px}
.accueil blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--bleu2);background:#fff;font-size:.95rem}
footer{font-size:.8rem;color:var(--gris);text-align:center;padding:10px}
.hidden{display:none !important}
@media (max-width:600px){
  main{padding:10px 10px 24px}
  .prm{grid-template-columns:1fr 1fr;}
  .prm .val{grid-column:2}
  .prm input[type=range]{grid-column:1 / span 2;grid-row:2}
  .animbox canvas{height:260px}
  .graphbox canvas{height:300px}
}

</style>
</head>
<body>
<header class="top">
  <span class="logo">UIMM CVDL</span>
  <h1>MOD06 · Équations différentielles · Simulateur</h1>
  <span class="sp"></span>
  <button id="bProj" title="Agrandit textes et tracés pour le vidéoprojecteur">Mode projection</button>
  <button id="bFull" title="Plein écran">Plein écran</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main">
  <section id="accueil" class="accueil"></section>
  <section id="work" class="hidden">
    <div class="titrebar">
      <h2 id="wTitre"></h2>
      <span class="niv" id="wNiv"></span>
      <select id="wModele" title="Situation étudiée"></select>
    </div>
    <div class="grid">
      <div class="col">
        <div class="card animbox"><canvas id="cvAnim"></canvas><div class="clock" id="clock">t = 0</div></div>
        <div class="card ctrl">
          <h3>Paramètres</h3>
          <div class="presets" id="presets"></div>
          <div id="params"></div>
          <div class="chk" id="options"></div>
        </div>
      </div>
      <div class="col">
        <div class="toolbar card">
          <button class="btn prim" id="bPlay" title="Lecture / pause (barre d'espace)">▶ Lecture</button>
          <button class="btn" id="bReset" title="Revenir à t = 0 (touche R)">↺ Départ</button>
          <span class="lab">Vitesse</span><select id="sVit" title="Vitesse de l'animation par rapport au temps réel"></select>
          <span class="sep"></span>
          <span class="lab">Vue</span><select id="sVue"></select>
          <span class="lab">Tracer</span><select id="sSortie"></select>
          <span class="sep"></span>
          <button class="btn" id="bAides" title="Tangente, asymptote, enveloppe, repères">Aides</button>
          <button class="btn" id="bFam" title="Famille de courbes solutions">Famille</button>
          <button class="btn" id="bEuler" title="Méthode d'Euler">Euler</button>
          <button class="btn" id="bMes" title="Deux curseurs de mesure">Mesure</button>
          <button class="btn defi" id="bDefi" title="Paramètre masqué à retrouver par la mesure">Défi</button>
          <span class="sep"></span>
          <button class="btn" id="bZin" title="Réduire la fenêtre de temps">t ÷ 2</button>
          <button class="btn" id="bZout" title="Agrandir la fenêtre de temps">t × 2</button>
          <button class="btn" id="bFit" title="Adapter les échelles aux paramètres actuels">Ajuster</button>
        </div>
        <div class="card graphbox">
          <canvas id="cvGraph"></canvas>
          <div class="subbar" id="subbar">
            <span id="famBox" class="hidden">Famille : <select id="sFam"></select></span>
            <span id="eulBox" class="hidden">Pas h <input type="range" id="rH" min="0" max="1000" value="500"> <b id="vH"></b> <span id="eErr"></span></span>
            <span class="grow"></span>
            <span class="mesure" id="mesTxt"></span>
          </div>
        </div>
        <div class="info">
          <div class="card eq" id="eqBox"></div>
          <div class="col" style="gap:12px">
            <div class="card" id="caracBox"></div>
            <div class="card defipanel hidden" id="defiBox"></div>
          </div>
        </div>
        <details class="card" id="qBox" open><summary>Questions pour le stagiaire</summary><ol id="qList"></ol></details>
        <details class="card ctx" id="ctxBox"><summary>Contexte, limites du modèle et sources</summary><div id="ctxTxt"></div></details>
      </div>
    </div>
  </section>
</main>
<footer>Pôle Formation UIMM Centre-Val de Loire · MOD06 Équations différentielles · Auteur SJ · v1.0 · octobre 2026</footer>
<script>

const mRL = (() => {
  const tau = p => p.L / p.R;
  const Ein = (t, p) => p.src === 'creneau' ? (Math.floor(t / (p.T / 2) + 1e-12) % 2 === 0 ? p.E : 0) : p.E;
  return {
    id: 'rl', label: 'Circuit RL série : établissement et rupture du courant', tUnit: {lab: 'ms', f: 1000}, tSec: 1, tcLab: 'τ',
    params: [
      {id: 'src', sym: 'Source', opts: [['echelon', 'Tension continue E (échelon)'], ['creneau', 'Créneau 0 / E (GBF)']], val: 'echelon', refit: true},
      {id: 'E', sym: '$E$', name: 'tension du générateur', unit: 'V', min: 0, max: 24, step: 0.5, val: 12},
      {id: 'R', sym: '$R$', name: 'résistance totale', unit: 'Ω', min: 2, max: 100, step: 1, val: 10},
      {id: 'L', sym: '$L$', name: 'inductance', unit: 'H', min: 0.05, max: 2, step: 0.05, val: 0.5},
      {id: 'i0', sym: '$i(0)$', name: 'courant initial', unit: 'A', min: 0, max: 3, step: 0.05, val: 0},
      {id: 'T', sym: '$T$', name: 'période du créneau', unit: 's', min: 0.05, max: 2, step: 0.01, val: 0.3, show: p => p.src === 'creneau'}
    ],
    presets: [
      {label: 'Établissement du courant', set: {src: 'echelon', E: 12, i0: 0}},
      {label: 'Coupure, diode de roue libre', set: {src: 'echelon', E: 0, i0: 1.2}, title: 'Le générateur est déconnecté ; le courant de la bobine se referme par la diode.'},
      {label: 'Créneau', set: {src: 'creneau', E: 12, i0: 0, R: 10, L: 0.5, T: 0.3}}
    ],
    y0: p => [p.i0],
    f: (t, y, p) => [(Ein(t, p) - p.R * y[0]) / p.L],
    exact: p => p.src === 'creneau' ? piecewise((lev, ys) => sol1(p.L, p.R, lev, ys[0]), [p.i0], p.T / 2, n => n % 2 === 0 ? p.E : 0) : sol1(p.L, p.R, p.E, p.i0),
    outs: [
      {id: 'i', lab: 'i : intensité du courant', sym: 'i', unit: 'A', get: (t, y) => y[0]},
      {id: 'uL', lab: 'u_L : tension aux bornes de la bobine', sym: 'u_L', unit: 'V', get: (t, y, p) => Ein(t, p) - p.R * y[0]},
      {id: 'uR', lab: 'u_R : tension aux bornes de la résistance', sym: 'u_R', unit: 'V', get: (t, y, p) => p.R * y[0]}
    ],
    views: ['temps'], flowRate: (t, y) => y[0],
    tc: tau, tmax: p => p.src === 'creneau' ? 3 * p.T : niceCeil(6 * tau(p)),
    carac: p => {
      const ta = tau(p), r = [{l: 'Constante de temps $\\tau = L/R$', v: fnum(ta * 1000, 'ms')}, {l: 'Durée du régime transitoire $5\\tau$', v: fnum(5000 * ta, 'ms')},
        {l: 'Courant final $E/R$', v: fnum(p.E / p.R, 'A')}];
      if (p.src === 'echelon') { r.push({l: '$i(\\tau)$', v: fnum(p.E / p.R + (p.i0 - p.E / p.R) * Math.exp(-1), 'A')});
        r.push({l: 'Énergie magnétique finale $\\tfrac12 L i^2$', v: fnum(0.5 * p.L * Math.pow(p.E / p.R, 2), 'J')}); }
      return r;
    },
    eq: p => {
      const L = [{t: 'Loi des mailles avec $u_L = L\\,\\dfrac{di}{dt}$', tex: 'L\\,\\dfrac{di}{dt}+R\\,i=E(t)'}];
      if (p.src === 'echelon') {
        L.push({t: 'Avec les valeurs actuelles (t en s)', tex: texSum(null, [[p.L, 'i\'(t)'], [p.R, 'i(t)']]) + '=' + tn(p.E), num: true});
        L.push({t: 'Solution générale', tex: 'i(t)=\\dfrac{E}{R}+K\\,e^{-t/\\tau},\\quad \\tau=\\dfrac{L}{R}'});
        L.push({t: 'Solution avec la condition initiale', tex: 'i(t)=' + texSum(p.E / p.R, [[p.i0 - p.E / p.R, ex1(p.R / p.L)]]), num: true});
      } else L.push({t: 'Avec les valeurs actuelles', tex: texSum(null, [[p.L, 'i\'(t)'], [p.R, 'i(t)']]) + '=E(t),\\quad E(t)\\in\\{0\\,;\\,' + tn(p.E) + '\\}', num: true});
      return L;
    },
    guides: (p, out) => {
      const ta = tau(p), G = []; if (p.src === 'creneau') return G; const iinf = p.E / p.R;
      if (out === 'i') { G.push({k: 'h', y: iinf, lab: 'asymptote i = E/R', color: COL.vert}); G.push({k: 'seg', x1: 0, y1: p.i0, x2: ta, y2: iinf, lab: 'tangente', color: COL.orange, dash: [2, 0]});
        G.push({k: 'v', x: ta, lab: 'τ'}); G.push({k: 'pt', x: ta, y: iinf + (p.i0 - iinf) * Math.exp(-1)}); G.push({k: 'v', x: 5 * ta, lab: '5τ'}); }
      else if (out === 'uL') { G.push({k: 'h', y: 0, lab: 'asymptote', color: COL.vert}); G.push({k: 'v', x: ta, lab: 'τ'}); }
      else { G.push({k: 'h', y: p.E, lab: 'asymptote u_R = E', color: COL.vert}); G.push({k: 'v', x: ta, lab: 'τ'}); }
      return G;
    },
    fam: [
      {lab: 'Conditions initiales i(0)', id: 'i0', vals: () => [0, 0.4, 0.8, 1.2, 1.6, 2], fmt: v => 'i(0) = ' + fmt(v) + ' A'},
      {lab: 'Inductance L', id: 'L', vals: () => [0.1, 0.25, 0.5, 1, 2], fmt: v => 'L = ' + fmt(v) + ' H'}
    ],
    defi: {hide: ['L'], range: {L: [0.1, 1.8]}, set: {src: 'echelon', E: 12, i0: 0, R: 10}, lock: ['src', 'i0'], tmax: () => 1.2, out: 'i',
      q: 'L\'inductance $L$ est masquée. Mesure la constante de temps $\\tau$ sur la courbe $i(t)$, puis calcule $L$ avec $\\tau = L/R$.',
      ask: '$L$', unit: 'H', answer: p => p.L, tol: 0.1, hint: 'À t = τ, le courant atteint 63 % de sa valeur finale E/R. Puis L = R × τ (τ en s).'},
    questions: [
      'Mesure $\\tau$ sur la courbe $i(t)$ et compare avec $L/R$.',
      'Trace $u_L(t)$ : que vaut la tension aux bornes de la bobine à $t = 0$ ? Et en régime permanent ?',
      'Preset « coupure » : sans la diode de roue libre, le courant devrait s\'annuler instantanément. Que vaudrait alors $L\\,\\dfrac{di}{dt}$ ? Pourquoi protège-t-on les bobines de relais par une diode ?',
      'Compare cette situation avec la charge du condensateur (onglet RC) : quelle grandeur joue le rôle de $u_C$ ?'
    ],
    ctx: '<p>Bobines de relais, de contacteurs, d\'électrovannes : le courant ne s\'établit pas instantanément. À la coupure, la diode de roue libre évite une surtension destructrice.</p><p><b>Limites du modèle :</b> inductance constante (pas de saturation du circuit magnétique), diode idéale.</p>',
    src: '<i>circuits en régime transitoire</i>, §III ; cours MOD06 Ordre 1, « Établissement du courant (circuit RL) » (R = 10 Ω, L = 0,5 H, E = 12 V).',
    draw: (c, W, H, st) => {
      const p = st.p, i = st.y[0], E = Ein(st.t, p), s = st.sc; const F = circuitFrame(c, W, H); const imax = Math.max(p.E / p.R, p.i0, 1e-6);
      D.dots(c, F.loop, -st.flow / (imax * tau(p)) * 26, 26, 'rgba(22,155,214,.85)', 3.2 * s);
      D.source(c, F.x1, (F.y1 + F.y2) / 2, 24 * s, 'E = ' + fmt(E, 3) + ' V', p.src === 'creneau' ? 'creneau' : 'dc');
      D.resistor(c, (F.x1 + F.x2) / 2, F.y1, 70 * s, false, 'R = ' + fmt(p.R) + ' Ω');
      D.inductor(c, F.x2, (F.y1 + F.y2) / 2, 80 * s, true, 'L = ' + fmt(p.L) + ' H', Math.abs(i) / imax);
      D.badge(c, 'i = ' + fmtFix(i, 3) + ' A', (F.x1 + F.x2) / 2, F.y1 + 34 * s, 15 * s, COL.rouge);
      D.badge(c, 'u_L = ' + fmtFix(E - p.R * i, 2) + ' V', F.x2 - 20, F.y2 + 26 * s, 14 * s, COL.bleu);
      if (p.E === 0 && p.src === 'echelon') D.text(c, 'générateur remplacé par la diode de roue libre', W / 2, H * 0.94, COL.gris, 13 * s, 'center');
    }
  };
})();

/* =========================================================================
   2. Refroidissement (loi de Newton)
   ========================================================================= */
const mNewton = (() => {
  const th = (t, p) => p.ta + (p.t0 - p.ta) * Math.exp(-p.k * t);
  const tcible = p => (p.tc - p.ta) / (p.t0 - p.ta) > 0 && (p.tc - p.ta) / (p.t0 - p.ta) < 1 ? Math.log((p.t0 - p.ta) / (p.tc - p.ta)) / p.k : NaN;
  return {
    id: 'newton', label: 'Refroidissement d\'une pièce après traitement thermique', tUnit: {lab: 'min', f: 1}, tSec: 60, tcLab: 'τ',
    params: [
      {id: 't0', sym: '$\\theta_0$', name: 'température de sortie du four', unit: '°C', min: 100, max: 1200, step: 10, val: 800},
      {id: 'ta', sym: '$\\theta_a$', name: 'température de l\'atelier', unit: '°C', min: 0, max: 40, step: 1, val: 20},
      {id: 'k', sym: '$k$', name: 'coefficient d\'échange', unit: 'min⁻¹', min: 0.01, max: 0.3, step: 0.005, val: 0.05},
      {id: 'tc', sym: '$\\theta_c$', name: 'température visée', unit: '°C', min: 30, max: 1000, step: 10, val: 100}
    ],
    presets: [{label: 'Exemple du cours (800 °C, k = 0,05)', set: {t0: 800, ta: 20, k: 0.05, tc: 100}}, {label: 'Refroidissement plus rapide (k = 0,15)', set: {k: 0.15}}],
    y0: p => [p.t0], f: (t, y, p) => [-p.k * (y[0] - p.ta)], exact: p => (t => [th(t, p)]),
    outs: [
      {id: 'th', lab: 'θ : température de la pièce', sym: 'θ', unit: '°C', get: (t, y) => y[0]},
      {id: 'ln', lab: 'ln(θ − θa) : linéarisation', sym: 'ln(θ − θa)', unit: '', get: (t, y, p) => y[0] - p.ta > 0 ? Math.log(y[0] - p.ta) : NaN}
    ],
    views: ['temps'], tc: p => 1 / p.k, tmax: p => niceCeil(6 / p.k),
    carac: p => {
      const tcb = tcible(p);
      return [{l: 'Constante de temps $\\tau = 1/k$', v: fnum(1 / p.k, 'min')}, {l: '$\\theta(\\tau)$', v: fnum(th(1 / p.k, p), '°C')},
        {l: 'Vitesse initiale $\\theta\'(0) = -k(\\theta_0-\\theta_a)$', v: fnum(-p.k * (p.t0 - p.ta), '°C/min')},
        {l: 'Instant où $\\theta = \\theta_c$', v: isFinite(tcb) ? fnum(tcb, 'min') : 'jamais atteint'}, {l: '$\\theta(5\\tau)$', v: fnum(th(5 / p.k, p), '°C')}];
    },
    eq: p => [
      {t: 'Loi de Newton : la vitesse de refroidissement est proportionnelle à l\'écart de température', tex: '\\dfrac{d\\theta}{dt}=-k\\,(\\theta-\\theta_a)\\iff \\theta\'+k\\,\\theta=k\\,\\theta_a'},
      {t: 'Avec les valeurs actuelles (t en min)', tex: '\\theta\'(t)+' + tn(p.k) + '\\,\\theta(t)=' + tn(p.k * p.ta), num: true},
      {t: 'Solution générale', tex: '\\theta(t)=\\theta_a+K\\,e^{-k t}'},
      {t: 'Solution avec la condition initiale', tex: '\\theta(t)=' + texSum(p.ta, [[p.t0 - p.ta, ex1(p.k)]]), num: true},
      {t: 'Linéarisation (droite de pente −k)', tex: '\\ln\\left(\\theta-\\theta_a\\right)=\\ln\\left(\\theta_0-\\theta_a\\right)-k\\,t'}
    ],
    guides: (p, out) => {
      const ta = 1 / p.k, G = [], tcb = tcible(p);
      if (out === 'th') { G.push({k: 'h', y: p.ta, lab: 'asymptote θ = θa', color: COL.vert}); G.push({k: 'seg', x1: 0, y1: p.t0, x2: ta, y2: p.ta, lab: 'tangente', color: COL.orange, dash: [2, 0]});
        G.push({k: 'v', x: ta, lab: 'τ'}); G.push({k: 'pt', x: ta, y: th(ta, p)});
        if (isFinite(tcb)) { G.push({k: 'h', y: p.tc, lab: 'θc', color: COL.rouge}); G.push({k: 'v', x: tcb, lab: 't = ' + fmt(tcb, 3) + ' min', color: COL.rouge}); } }
      else G.push({k: 'seg', x1: 0, y1: Math.log(p.t0 - p.ta), x2: 1 / p.k, y2: Math.log(p.t0 - p.ta) - 1, lab: 'pente −k', color: COL.orange, dash: [2, 0]});
      return G;
    },
    fam: [
      {lab: 'Conditions initiales θ0', id: 't0', vals: () => [200, 400, 600, 800, 1000, 1200], fmt: v => 'θ0 = ' + fmt(v) + ' °C'},
      {lab: 'Coefficient k', id: 'k', vals: () => [0.02, 0.05, 0.1, 0.2], fmt: v => 'k = ' + fmt(v) + ' min⁻¹'}
    ],
    defi: {hide: ['k'], range: {k: [0.02, 0.15]}, set: {t0: 800, ta: 20}, lock: ['ta'], tmax: () => 150, out: 'th',
      q: 'Le coefficient $k$ est masqué. Mesure la constante de temps $\\tau$ (tangente à l\'origine, ou instant où l\'écart $\\theta-\\theta_a$ ne vaut plus que 37 % de $\\theta_0-\\theta_a$), puis déduis $k = 1/\\tau$.',
      ask: '$k$', unit: 'min⁻¹', answer: p => p.k, tol: 0.1, hint: 'Avec θ0 = 800 °C et θa = 20 °C, la température à t = τ vaut 20 + 0,37 × 780 ≈ 307 °C. Autre méthode : trace ln(θ − θa), sa pente vaut −k.'},
    questions: [
      'Lis la température au bout de 20 min. Compare avec le calcul $20 + 780\\,e^{-1}$.',
      'Combien de temps faut-il pour atteindre 100 °C ? Vérifie avec $t = \\dfrac{\\ln(780/80)}{0{,}05}$.',
      'Le refroidissement est-il plus rapide au début ou à la fin ? Justifie avec l\'équation différentielle.',
      'Trace $\\ln(\\theta-\\theta_a)$ : quelle courbe obtiens-tu ? Comment en déduire $k$ à partir de mesures réelles ?',
      'Active Euler avec $h = 20$ min, puis $h = 5$ min. Que constates-tu ?'
    ],
    ctx: '<p>Après forgeage, recuit ou revenu, une pièce refroidit à l\'air de l\'atelier. Connaître la loi de refroidissement permet de savoir quand la manipuler, l\'usiner ou la contrôler. Le programme cite explicitement la loi de refroidissement comme exemple.</p><p><b>Limites du modèle :</b> la loi de Newton suppose un échange proportionnel à l\'écart de température. Aux températures élevées, le rayonnement rend l\'échange plus rapide que prévu. En trempe à l\'eau ou à l\'huile, l\'ébullition du fluide rend le modèle très approximatif.</p>',
    src: 'Cours MOD06 Ordre 1, « Refroidissement après traitement thermique » (θ0 = 800 °C, θa = 20 °C, k = 0,05 min⁻¹) ; TD Activités MOD06, « Refroidissement d\'une pièce mécanique » ; programme BTS, p. 17 (« Loi de refroidissement »).',
    draw: (c, W, H, st) => {
      const p = st.p, T = st.y[0], s = st.sc;
      c.fillStyle = '#eef3f7'; c.fillRect(0, H * 0.78, W, H * 0.22); D.line(c, 0, H * 0.78, W, H * 0.78, '#9aa8b5', 2);
      const px = W * 0.12, pw = W * 0.5, py = H * 0.48, ph = H * 0.2;
      const ex = clamp((T - p.ta) / 1000, 0, 1);
      c.strokeStyle = 'rgba(232,135,30,' + (0.15 + 0.6 * ex) + ')'; c.lineWidth = 2;
      for (let k = 0; k < 6; k++) { const x0 = px + pw * (k + 0.5) / 6; c.beginPath(); for (let j = 0; j <= 20; j++) { const yy = py - 8 - j * (40 * ex + 8) / 20; const xx = x0 + Math.sin(j * 0.7 + st.t * 0.8 + k) * 5; j ? c.lineTo(xx, yy) : c.moveTo(xx, yy); } c.stroke(); }
      const g = c.createLinearGradient(0, py, 0, py + ph); g.addColorStop(0, incandescence(T + 30)); g.addColorStop(0.5, incandescence(T)); g.addColorStop(1, incandescence(T - 60));
      c.fillStyle = g; D.rrect(c, px, py, pw, ph, ph * 0.45); c.fill(); c.strokeStyle = '#444'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#8a8f96'; c.fillRect(px + pw * 0.15, H * 0.68, 10, H * 0.1); c.fillRect(px + pw * 0.8, H * 0.68, 10, H * 0.1);
      D.text(c, 'pièce en acier', px + pw / 2, py + ph + 22 * s, COL.gris, 13 * s, 'center');
      // thermomètre
      const tx = W * 0.8, ty0 = H * 0.1, ty1 = H * 0.72, Tm = 1200;
      c.fillStyle = '#fff'; c.strokeStyle = '#333'; c.lineWidth = 2; D.rrect(c, tx - 9, ty0, 18, ty1 - ty0, 9); c.fill(); c.stroke();
      c.beginPath(); c.arc(tx, ty1 + 10, 16, 0, 2 * Math.PI); c.fillStyle = COL.rouge; c.fill(); c.stroke();
      const yT = ty1 - (ty1 - ty0 - 8) * clamp(T / Tm, 0, 1); c.fillStyle = COL.rouge; c.fillRect(tx - 5, yT, 10, ty1 - yT + 6);
      D.font(c, 11 * s); c.fillStyle = COL.gris; c.textAlign = 'right';
      for (let v = 0; v <= Tm; v += 200) { const yy = ty1 - (ty1 - ty0 - 8) * v / Tm; D.line(c, tx - 12, yy, tx - 9, yy, '#333', 1); c.fillText(v + ' °C', tx - 15, yy); }
      const ya = ty1 - (ty1 - ty0 - 8) * p.ta / Tm; D.line(c, tx + 10, ya, tx + 24, ya, COL.vert, 2);
      D.badge(c, 'θ = ' + fmtFix(T, 0) + ' °C', px + pw / 2, H * 0.2, 17 * s, COL.rouge);
      D.text(c, 'atelier : θa = ' + fmt(p.ta) + ' °C', W * 0.04, H * 0.9, COL.vert, 13 * s, 'left', true);
    }
  };
})();

/* =========================================================================
   3. Chute dans un fluide : viscosimètre à bille, parachutiste
   ========================================================================= */
const mVisco = (() => {
  const K = p => { const r = p.r / 1000, V = 4 / 3 * Math.PI * r * r * r, m = p.rs * V, k = 6 * Math.PI * p.eta * r; return {r, V, m, k, tau: m / k, a: G * (1 - p.rf / p.rs), vl: G * (1 - p.rf / p.rs) * m / k}; };
  return {
    id: 'visco', label: 'Bille dans un liquide visqueux (viscosimètre, loi de Stokes et poussée d\'Archimède)', tUnit: {lab: 'ms', f: 1000}, tSec: 1, tcLab: 'τ',
    params: [
      {id: 'r', sym: '$r$', name: 'rayon de la bille', unit: 'mm', min: 0.5, max: 5, step: 0.1, val: 2.5},
      {id: 'rs', sym: '$\\rho_s$', name: 'masse volumique de la bille', unit: 'kg/m³', min: 1000, max: 8000, step: 10, val: 7850},
      {id: 'rf', sym: '$\\rho_f$', name: 'masse volumique du liquide', unit: 'kg/m³', min: 700, max: 1500, step: 1, val: 1261},
      {id: 'eta', sym: '$\\eta$', name: 'viscosité dynamique', unit: 'Pa·s', min: 0.05, max: 5, log: true, val: 1.41},
      {id: 'v0', sym: '$v_0$', name: 'vitesse initiale', unit: 'mm/s', min: -100, max: 200, step: 5, val: 0}
    ],
    presets: [
      {label: 'Acier dans la glycérine', set: {r: 2.5, rs: 7850, rf: 1261, eta: 1.41, v0: 0}, title: 'Glycérine à 20 °C : ρ ≈ 1 261 kg/m³, η ≈ 1,41 Pa·s'},
      {label: 'Verre (ρ ≈ 2 500)', set: {rs: 2500, v0: 0}},
      {label: 'Nylon (ρ ≈ 1 140)', set: {rs: 1140, v0: 0}, title: 'Moins dense que la glycérine'},
      {label: 'Bille lancée vers le bas', set: {v0: 150}}
    ],
    y0: p => [0, p.v0 / 1000],
    f: (t, y, p) => { const k = K(p); return [y[1], k.a - k.k / k.m * y[1]]; },
    exact: p => { const k = K(p), v0 = p.v0 / 1000; return t => { const e = Math.exp(-t / k.tau); return [k.vl * t + (v0 - k.vl) * k.tau * (1 - e), k.vl + (v0 - k.vl) * e]; }; },
    outs: [
      {id: 'v', lab: 'v : vitesse de la bille', sym: 'v', unit: 'mm/s', get: (t, y) => y[1] * 1000},
      {id: 'y', lab: 'y : distance parcourue (vers le bas)', sym: 'y', unit: 'mm', get: (t, y) => y[0] * 1000}
    ],
    views: ['temps'], tc: p => K(p).tau, tmax: p => niceCeil(6 * K(p).tau),
    carac: p => {
      const k = K(p), Re = p.rf * Math.abs(k.vl) * 2 * k.r / p.eta;
      return [{l: 'Masse de la bille $m$', v: fnum(k.m * 1000, 'g')}, {l: 'Poids $P = mg$', v: fnum(k.m * G * 1000, 'mN')}, {l: 'Poussée d\'Archimède $\\Pi = \\rho_f V g$', v: fnum(p.rf * k.V * G * 1000, 'mN')},
        {l: 'Coefficient de frottement $6\\pi\\eta r$', v: fnum(k.k, 'kg/s')}, {l: 'Constante de temps $\\tau = \\dfrac{m}{6\\pi\\eta r}$', v: fnum(k.tau * 1000, 'ms')},
        {l: 'Vitesse limite $v_l$', v: fnum(k.vl * 1000, 'mm/s')}, {l: 'Nombre de Reynolds $Re = \\dfrac{\\rho_f\\,v_l\\,2r}{\\eta}$', v: fmt(Re, 2) + (Re <= 1 ? ' (Stokes valable)' : '')}];
    },
    alert: p => { const k = K(p), Re = p.rf * Math.abs(k.vl) * 2 * k.r / p.eta; let s = '';
      if (p.rs < p.rf) s += 'La bille est moins dense que le liquide : la poussée d\'Archimède l\'emporte sur le poids, la bille remonte (v < 0). ';
      if (Re > 1) s += 'Re = ' + fmt(Re, 2) + ' > 1 : la loi de Stokes (frottement proportionnel à v) devient approximative.'; return s || null; },
    eq: p => { const k = K(p);
      return [{t: 'Principe fondamental de la dynamique (axe vers le bas)', tex: 'm\\,\\dfrac{dv}{dt}=mg-\\rho_f V g-6\\pi\\eta r\\,v'},
        {t: 'Forme normalisée', tex: '\\dfrac{dv}{dt}+\\dfrac{1}{\\tau}\\,v=g\\left(1-\\dfrac{\\rho_f}{\\rho_s}\\right),\\qquad \\tau=\\dfrac{m}{6\\pi\\eta r}'},
        {t: 'Avec les valeurs actuelles (unités SI)', tex: 'v\'(t)+' + tn(1 / k.tau) + '\\,v(t)=' + tn(k.a), num: true},
        {t: 'Solution avec la condition initiale (v en m/s, t en s)', tex: 'v(t)=' + texSum(k.vl, [[p.v0 / 1000 - k.vl, ex1(1 / k.tau)]]), num: true}]; },
    guides: (p, out) => { const k = K(p), G = []; if (out !== 'v') return G;
      G.push({k: 'h', y: k.vl * 1000, lab: 'vitesse limite v_l', color: COL.vert}); G.push({k: 'seg', x1: 0, y1: p.v0, x2: k.tau, y2: k.vl * 1000, lab: 'tangente', color: COL.orange, dash: [2, 0]});
      G.push({k: 'v', x: k.tau, lab: 'τ'}); G.push({k: 'pt', x: k.tau, y: 1000 * (k.vl + (p.v0 / 1000 - k.vl) * Math.exp(-1))}); return G; },
    fam: [
      {lab: 'Conditions initiales v0', id: 'v0', vals: () => [-50, 0, 50, 100, 150, 200], fmt: v => 'v0 = ' + fmt(v) + ' mm/s'},
      {lab: 'Rayon r', id: 'r', vals: () => [1, 1.5, 2, 2.5, 3], fmt: v => 'r = ' + fmt(v) + ' mm'}
    ],
    defi: {hide: ['eta'], range: {eta: [0.5, 3]}, set: {r: 2.5, rs: 7850, rf: 1261, v0: 0}, lock: ['v0'], tmax: () => 0.25, out: 'v',
      q: 'La viscosité $\\eta$ du liquide est masquée. Lis la vitesse limite $v_l$ sur la courbe, puis calcule $\\eta=\\dfrac{2(\\rho_s-\\rho_f)\\,g\\,r^2}{9\\,v_l}$ (unités SI).',
      ask: '$\\eta$', unit: 'Pa·s', answer: p => p.eta, tol: 0.1, hint: 'Convertis : r en m (2,5 mm = 0,0025 m), v_l en m/s. Exemple : v_l = 64 mm/s = 0,064 m/s.'},
    questions: [
      'Lance l\'animation. Au début, le frottement est nul : quelle force l\'emporte ? Observe les flèches : à la vitesse limite, vérifie que $P = \\Pi + F_f$.',
      'Mesure $\\tau$. Pourquoi un viscosimètre mesure-t-il la vitesse entre deux repères situés loin du point de lâcher ?',
      'Choisis une bille en nylon. Que se passe-t-il ? Explique avec la poussée d\'Archimède.',
      'Augmente $r$. Que deviennent $v_l$ et le nombre de Reynolds ? Le modèle de Stokes reste-t-il valable ?',
      'Famille « conditions initiales » : que deviennent toutes les solutions quand $t$ devient grand ?'
    ],
    ctx: '<p>Le viscosimètre à chute de bille mesure la viscosité d\'une huile ou d\'un liquide de process : on chronomètre la bille entre deux repères, on en déduit $v_l$ puis $\\eta$. En maintenance, la viscosité d\'une huile renseigne sur son état de dégradation.</p><p><b>Limites du modèle :</b> la loi de Stokes ($F_f = 6\\pi\\eta r v$) n\'est valable que si le nombre de Reynolds reste petit devant 1. Les parois du tube freinent aussi la bille ; les viscosimètres réels appliquent une correction.</p>',
    src: '<i>09_equations_differentielles_physique</i>, §3.4.2 (chute avec frottement) ; <i>Equations-differentielles en physique</i> (mécanique du point) ; cours MOD06 Ordre 1, « Chute avec frottement visqueux ».',
    draw: (c, W, H, st) => {
      const p = st.p, k = K(p), s = st.sc, yb = st.y[0], v = st.y[1];
      const tx = W * 0.32, tw = W * 0.2, t0 = H * 0.06, t1 = H * 0.94;
      c.fillStyle = 'rgba(232,180,60,.28)'; c.fillRect(tx - tw / 2, t0 + 10, tw, t1 - t0 - 10);
      c.strokeStyle = '#6d7d8c'; c.lineWidth = 3; c.beginPath(); c.moveTo(tx - tw / 2, t0); c.lineTo(tx - tw / 2, t1); c.lineTo(tx + tw / 2, t1); c.lineTo(tx + tw / 2, t0); c.stroke();
      const span = Math.max(refMax(st.app, y => y[0]) * 1.15, 6 * k.r);
      const up = refMax(st.app, y => Math.max(0, -y[0])) > refMax(st.app, y => Math.max(0, y[0]));
      const ppm = (t1 - t0 - 40) / span; const yOrig = up ? t1 - 20 : t0 + 24;
      const by = yOrig + yb * ppm; const br = Math.max(6 * s, k.r * ppm);
      // règle
      const st0 = niceStep(span * 1000, 6); D.font(c, 11 * s); c.fillStyle = COL.gris; c.textAlign = 'left';
      for (let mm = 0; mm <= span * 1000 + 1e-9; mm += st0) { const yy = up ? yOrig - mm / 1000 * ppm : yOrig + mm / 1000 * ppm; D.line(c, tx + tw / 2 + 4, yy, tx + tw / 2 + 12, yy, '#333', 1); c.fillText(fmt(mm, 3) + ' mm', tx + tw / 2 + 15, yy); }
      const gb = c.createRadialGradient(tx - br * 0.3, by - br * 0.3, 1, tx, by, br);
      gb.addColorStop(0, '#fff'); gb.addColorStop(1, p.rs > 5000 ? '#5b6670' : p.rs > 2000 ? '#9fc6d8' : '#e8e2d0');
      c.fillStyle = gb; c.beginPath(); c.arc(tx, by, br, 0, 2 * Math.PI); c.fill(); c.strokeStyle = '#333'; c.lineWidth = 1; c.stroke();
      const P = k.m * G, Pi = p.rf * k.V * G, Ff = k.k * v, sc = 60 * s / Math.max(P, Pi);
      D.font(c, 13 * s, true);
      D.arrow(c, tx, by, tx, by + P * sc, COL.rouge, 3, 'P', [tx + 8, by + P * sc]);
      D.arrow(c, tx - br - 6, by, tx - br - 6, by - Pi * sc, COL.bleu, 3); D.text(c, 'Π', tx - br - 14, by - Pi * sc, COL.bleu, 14 * s, 'right', true);
      if (Math.abs(Ff * sc) > 2) { D.arrow(c, tx + br + 6, by, tx + br + 6, by - Ff * sc, COL.vert, 3); D.text(c, 'F_f', tx + br + 12, by - Ff * sc, COL.vert, 14 * s, 'left', true); }
      const bx = W * 0.76;
      D.badge(c, 'v = ' + fmtFix(v * 1000, 1) + ' mm/s', bx, H * 0.14, 15 * s, COL.bleu);
      D.text(c, 'P = ' + fmt(P * 1000, 3) + ' mN', bx - 60 * s, H * 0.3, COL.rouge, 13 * s, 'left', true);
      D.text(c, 'Π = ' + fmt(Pi * 1000, 3) + ' mN', bx - 60 * s, H * 0.38, COL.bleu, 13 * s, 'left', true);
      D.text(c, 'F_f = ' + fmt(Ff * 1000, 3) + ' mN', bx - 60 * s, H * 0.46, COL.vert, 13 * s, 'left', true);
      D.text(c, 'P − Π − F_f = ' + fmt((P - Pi - Ff) * 1000, 3) + ' mN', bx - 60 * s, H * 0.56, '#1d2630', 13 * s, 'left', true);
    }
  };
})();

const mPara = (() => {
  const RHO = 1.2;
  const K = p => { const kq = 0.5 * RHO * p.S; return {kq, vl: Math.sqrt(p.m * G / kq)}; };
  const lncosh = x => { const a = Math.abs(x); return a + Math.log1p(Math.exp(-2 * a)) - Math.LN2; };
  const lnsinh = x => x + Math.log1p(-Math.exp(-2 * x)) - Math.LN2;
  return {
    id: 'para', label: 'Chute d\'un parachutiste (frottement quadratique, non linéaire)', tUnit: {lab: 's', f: 1}, tSec: 1, tcLab: 'v_l/g',
    params: [
      {id: 'm', sym: '$m$', name: 'masse équipée', unit: 'kg', min: 50, max: 120, step: 1, val: 80},
      {id: 'S', sym: '$S\\,C_x$', name: 'surface frontale × coefficient de traînée', unit: 'm²', min: 0.3, max: 60, log: true, val: 0.5},
      {id: 'v0', sym: '$v_0$', name: 'vitesse initiale', unit: 'm/s', min: 0, max: 60, step: 0.5, val: 0}
    ],
    options: [{id: 'lin', label: 'Superposer le modèle linéaire de même vitesse limite', val: true}],
    presets: [
      {label: 'Chute libre, position à plat', set: {S: 0.5, v0: 0}},
      {label: 'Ouverture du parachute', set: {S: 50, v0: 51}, title: 'Voile supposée ouverte instantanément à 51 m/s'}
    ],
    y0: p => [0, p.v0],
    f: (t, y, p) => { const k = K(p); return [y[1], G - k.kq / p.m * y[1] * Math.abs(y[1])]; },
    exact: p => { const {vl} = K(p), v0 = p.v0, c = vl * vl / G;
      if (Math.abs(v0 - vl) < 1e-9 * vl) return t => [vl * t, vl];
      if (v0 < vl) { const a = Math.atanh(v0 / vl), l0 = lncosh(a); return t => { const u = G * t / vl + a; return [c * (lncosh(u) - l0), vl * Math.tanh(u)]; }; }
      const b = Math.atanh(vl / v0), l0 = lnsinh(b); return t => { const u = G * t / vl + b; return [c * (lnsinh(u) - l0), vl / Math.tanh(u)]; }; },
    outs: [
      {id: 'v', lab: 'v : vitesse de chute', sym: 'v', unit: 'm/s', get: (t, y) => y[1]},
      {id: 'kmh', lab: 'v en km/h', sym: 'v', unit: 'km/h', get: (t, y) => y[1] * 3.6},
      {id: 'z', lab: 'z : hauteur descendue', sym: 'z', unit: 'm', get: (t, y) => y[0]}
    ],
    views: ['temps'], tc: p => K(p).vl / G, tmax: p => niceCeil(Math.max(6 * K(p).vl / G, 2)),
    carac: p => { const {kq, vl} = K(p), a0 = G * (1 - p.v0 * p.v0 / (vl * vl));
      return [{l: 'Coefficient $K = \\tfrac12\\rho\\,S\\,C_x$ (ρ = 1,2 kg/m³)', v: fnum(kq, 'kg/m')}, {l: 'Vitesse limite $v_l=\\sqrt{\\dfrac{mg}{K}}$', v: fnum(vl, 'm/s') + ' = ' + fmt(vl * 3.6, 3) + ' km/h'},
        {l: 'Temps caractéristique $v_l/g$', v: fnum(vl / G, 's')}, {l: 'Accélération initiale', v: fnum(a0, 'm/s²') + ' (' + fmt(a0 / G, 3) + ' g)'}]; },
    alert: p => { const {vl} = K(p), a0 = G * (1 - p.v0 * p.v0 / (vl * vl)); return a0 < -5 * G ? 'Décélération initiale de ' + fmt(-a0 / G, 3) + ' g : le modèle suppose une voile ouverte instantanément. En réalité, la voile se déploie progressivement, ce qui limite fortement la décélération.' : null; },
    eq: p => { const {kq, vl} = K(p);
      return [{t: 'Principe fondamental de la dynamique (axe vers le bas)', tex: 'm\\,\\dfrac{dv}{dt}=mg-\\tfrac12\\,\\rho\\,S\\,C_x\\,v^2'},
        {t: 'Avec les valeurs actuelles (unités SI)', tex: tn(p.m) + '\\,v\'(t)=' + tn(p.m * G, 4) + '-' + tn(kq) + '\\,v(t)^2', num: true},
        {t: 'Équation non linéaire (terme en v²), à variables séparables : étude possible en BTS, sans être un attendu du programme. Solution exacte :', tex: p.v0 < vl ? 'v(t)=v_l\\,\\tanh\\left(\\dfrac{g\\,t}{v_l}+\\operatorname{argth}\\dfrac{v_0}{v_l}\\right)' : 'v(t)=\\dfrac{v_l}{\\tanh\\left(\\dfrac{g\\,t}{v_l}+\\operatorname{argth}\\dfrac{v_l}{v_0}\\right)}'},
        {t: 'Modèle linéaire de même vitesse limite (courbe orange)', tex: 'v\'(t)+\\dfrac{g}{v_l}\\,v(t)=g\\;\\Rightarrow\\; v(t)=v_l+(v_0-v_l)\\,e^{-g t/v_l}'}]; },
    extra: (p, o, ts, out) => { if (!o.lin || out === 'z') return []; const {vl} = K(p), f = out === 'kmh' ? 3.6 : 1;

    guides: (p, out) => { if (out === 'z') return []; const {vl} = K(p), f = out === 'kmh' ? 3.6 : 1, a0 = G * (1 - p.v0 * p.v0 / (vl * vl)); const G2 = [{k: 'h', y: vl * f, lab: 'vitesse limite', color: COL.vert}];
      if (Math.abs(a0) > 1e-9) { const t1 = (vl - p.v0) / a0; G2.push({k: 'seg', x1: 0, y1: p.v0 * f, x2: t1, y2: vl * f, lab: 'tangente à l\'origine', color: COL.orange, dash: [2, 0]}); }
      return G2; },
    fam: [
      {lab: 'Conditions initiales v0', id: 'v0', vals: () => [0, 20, 40, 60], fmt: v => 'v0 = ' + fmt(v) + ' m/s'},

    ],
    defi: {hide: ['S'], range: {S: [0.4, 1.2]}, set: {v0: 0, m: 80}, lock: ['v0'], tmax: () => 40, out: 'v',
      q: 'La surface $S\\,C_x$ est masquée. Mesure la vitesse limite $v_l$, puis calcule $S\\,C_x=\\dfrac{2\\,m\\,g}{\\rho\\,v_l^2}$ avec $\\rho$ = 1,2 kg/m³.',
      ask: '$S\\,C_x$', unit: 'm²', answer: p => p.S, tol: 0.1, hint: 'Lis la valeur vers laquelle tend la vitesse (en m/s), puis applique la formule avec m = 80 kg.'},
    questions: [

    ctx: '<p>Aux vitesses courantes dans l\'air, la traînée est proportionnelle au carré de la vitesse. L\'équation devient non linéaire. Le programme indique que l\'on peut étudier « des exemples simples de résolution d\'équations différentielles non linéaires, du premier ordre à variables séparables, par exemple en mécanique », sans que ce soit un attendu.</p><p><b>Limites du modèle :</b> masse volumique de l\'air supposée constante (elle diminue avec l\'altitude), $C_x$ constant, poussée d\'Archimède dans l\'air négligée.</p>',
    src: '<i>Equations-differentielles en physique</i> (mécanique, objet dans le champ de pesanteur) ; <i>09_equations_differentielles_physique</i>, §3.4.2 ; programme BTS, p. 17.',
    draw: (c, W, H, st) => {
      const p = st.p, s = st.sc, z = st.y[0], v = st.y[1], {kq, vl} = K(p);

      const scy = 6; c.fillStyle = 'rgba(255,255,255,.9)';

const mPiscine = (() => {

/* caractéristiques d'un oscillateur a y'' + b y' + c y */
function osc(a, b, c) {
  const w0 = Math.sqrt(c / a), xi = b / (2 * Math.sqrt(a * c)), al = b / (2 * a);
  const wd = xi < 1 ? w0 * Math.sqrt(1 - xi * xi) : NaN;
  const td = xi === 0 ? Infinity : xi < 1 ? 4 / (xi * w0) : 5 / (w0 * (xi - Math.sqrt(xi * xi - 1)));
  return {w0, xi, al, wd, T0: 2 * Math.PI / w0, Tps: 2 * Math.PI / wd, td};
}
function tmaxOsc(a, b, c) { const o = osc(a, b, c); return niceCeil(o.xi < 1 ? clamp(o.td, 3 * o.T0, 10 * o.T0) : Math.min(o.td, 30 * o.T0)); }
function caracOsc(a, b, c, tu, tf, xiNote) {
  const o = osc(a, b, c), r = [{l: 'Pulsation propre $\\omega_0$', v: fnum(o.w0, 'rad/s')}, {l: 'Période propre $T_0 = 2\\pi/\\omega_0$', v: fnum(o.T0 * tf, tu)},
    {l: 'Coefficient d\'amortissement $\\xi$' + (xiNote ? ' <small>(noté m dans le cours)</small>' : ''), v: fmt(o.xi, 3)}, {l: 'Régime', v: regime(o.xi), cls: 'regime'}];
  if (o.xi < 1 && o.xi > 0) { r.push({l: 'Pseudo-période $T = \\dfrac{2\\pi}{\\omega_0\\sqrt{1-\\xi^2}}$', v: fnum(o.Tps * tf, tu)});
    r.push({l: 'Décrément logarithmique $\\delta = \\dfrac{2\\pi\\xi}{\\sqrt{1-\\xi^2}}$', v: fmt(2 * Math.PI * o.xi / Math.sqrt(1 - o.xi * o.xi), 3)}); }
  return r;
}
function enveloppe(a, b, c, d, y0, v0, f) { // amplitude A e^{-alpha t} autour de d/c (cas pseudo-périodique)
  const o = osc(a, b, c); if (!(o.xi < 1)) return null; const Y0 = y0 - d / c, B = (v0 + o.al * Y0) / o.wd; const A = Math.hypot(Y0, B);
  return {A, al: o.al, yp: d / c, fn: (t, sg) => f * (d / c + sg * A * Math.exp(-o.al * t))};
}
/* dessin d'un bloc masse */
function bloc(c, x, y, w, h, lab, col) { const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, col || '#3d7ea6'); g.addColorStop(1, '#215a7d');
  c.fillStyle = g; D.rrect(c, x, y, w, h, 5); c.fill(); c.strokeStyle = '#163f58'; c.lineWidth = 1.5; c.stroke(); if (lab) D.text(c, lab, x + w / 2, y + h / 2, '#fff', 14, 'center', true); }

      {id: 'u0', sym: '$u_C(0)$', name: 'tension initiale', unit: 'V', min: -20, max: 20, step: 0.5, val: 0},
      {id: 'T', sym: '$T$', name: 'période du créneau', unit: 'ms', min: 2, max: 200, step: 1, val: 60, show: p => p.src === 'creneau'}
    ],
    presets: [
      {label: 'Pseudo-périodique (R = 20 Ω)', set: {src: 'echelon', R: 20, E: 10, u0: 0}},
      {label: 'Critique', fn: p => ({src: 'echelon', R: 2 * Math.sqrt(p.L * 1e-3 / (p.C * 1e-6)), E: 10, u0: 0})},
      {label: 'Apériodique (R = 600 Ω)', set: {src: 'echelon', R: 600, E: 10, u0: 0}},
      {label: 'Décharge (E = 0)', set: {src: 'echelon', E: 0, u0: 10}},

    exact: p => p.src === 'creneau' ? piecewise((lev, ys) => sol2(LC(p), RC(p), 1, lev, ys[0], ys[1]), [p.u0, 0], p.T / 2000, n => n % 2 === 0 ? p.E : 0) : sol2(LC(p), RC(p), 1, p.E, p.u0, 0),
    outs: [

      {id: 'uR', lab: 'u_R : tension aux bornes de R', sym: 'u_R', unit: 'V', get: (t, y, p) => p.R * p.C * 1e-6 * y[1]},
      {id: 'uL', lab: 'u_L : tension aux bornes de la bobine', sym: 'u_L', unit: 'V', get: (t, y, p) => Ein(t, p) - y[0] - p.R * p.C * 1e-6 * y[1]}
    ],

    eLab: ['Énergie magnétique ½ L i²', 'Énergie électrique ½ C u_C²', 'Énergie totale'],

    tc: p => 2 * Math.PI * Math.sqrt(LC(p)), tmax: p => p.src === 'creneau' ? 3 * p.T / 1000 : tmaxOsc(LC(p), RC(p), 1),

        {t: 'Forme canonique', tex: '\\dfrac{d^2u_C}{dt^2}+2\\xi\\omega_0\\dfrac{du_C}{dt}+\\omega_0^2\\,u_C=\\omega_0^2\\,E,\\quad \\omega_0=\\dfrac{1}{\\sqrt{LC}},\\quad \\xi=\\dfrac{R}{2}\\sqrt{\\dfrac{C}{L}}'},

      if (p.src === 'echelon') { const s = sol2tex(LC(p), RC(p), 1, p.E, p.u0, 0, 'u_C'); L.push({t: 'Équation caractéristique', tex: s.car + ',\\qquad \\Delta=' + tn(s.D, 3), num: true}); L.push({t: 'Racines', tex: s.roots, num: true}); L.push({t: 'Solution', tex: s.sol, num: true}); }
      return L; },
    guides: (p, out) => { const G2 = []; if (out !== 'u') return [{k: 'h', y: 0, color: COL.vert}];
      if (p.src === 'creneau') return [{k: 'h', y: p.E, lab: 'E', color: COL.vert}];
      G2.push({k: 'h', y: p.E, lab: 'valeur finale E', color: COL.vert});
      const e = p.R > 0 ? enveloppe(LC(p), RC(p), 1, p.E, p.u0, 0, 1) : null;
      if (e) { G2.push({k: 'fn', fn: t => e.fn(t, 1), lab: 'enveloppe', color: COL.orange}); G2.push({k: 'fn', fn: t => e.fn(t, -1), color: COL.orange}); }
      const o = osc(LC(p), RC(p), 1); if (o.xi < 1 && p.E !== p.u0) { const t1 = Math.PI / o.wd; const u1 = sol2(LC(p), RC(p), 1, p.E, p.u0, 0)(t1)[0]; G2.push({k: 'pt', x: t1, y: u1, lab: 'D = ' + fmt(100 * (u1 - p.E) / (p.E - p.u0), 3) + ' %', color: COL.rouge}); }
      return G2; },
    fam: [
      {lab: 'Résistance R (régimes)', id: 'R', vals: p => [0.1, 0.3, 0.6, 1, 2].map(z => z * 2 * Math.sqrt(p.L * 1e-3 / (p.C * 1e-6))), fmt: v => 'R = ' + fmt(v, 3) + ' Ω'},
      {lab: 'Capacité C', id: 'C', vals: () => [2, 5, 10, 20, 50], fmt: v => 'C = ' + fmt(v) + ' µF'},
      {lab: 'Conditions initiales u_C(0)', id: 'u0', vals: () => [-10, -5, 0, 5, 15], fmt: v => 'u_C(0) = ' + fmt(v) + ' V'}
    ],
    defi: {hide: ['C'], range: {C: [2, 90]}, set: {src: 'echelon', E: 10, R: 10, L: 100, u0: 0}, lock: ['L', 'src', 'u0'], tmax: () => 0.06, out: 'u',
      q: 'La capacité $C$ est masquée ($L$ = 100 mH). Mesure la pseudo-période $T$ sur plusieurs oscillations, puis calcule $C\\approx\\dfrac{T^2}{4\\pi^2 L}$ (l\'amortissement est faible).',
      ask: '$C$', unit: 'µF', answer: p => p.C, tol: 0.1, hint: 'T est en ms sur le graphique : convertis en s. Avec L = 0,1 H, C (en F) = T² / (4π² × 0,1), puis multiplie par 10⁶ pour l\'avoir en µF.'},
    questions: [
      'Fais varier $R$ : repère les trois régimes. Compare la résistance critique observée avec $2\\sqrt{L/C}$.',
      'Mesure la pseudo-période. Compare avec $T_0 = 2\\pi\\sqrt{LC}$.',
      'Mesure le premier dépassement et compare avec $D = e^{-\\pi\\xi/\\sqrt{1-\\xi^2}}$.',
      'Vue « énergies » : comment l\'énergie s\'échange-t-elle entre la bobine et le condensateur ? Où se dissipe-t-elle ?',

    ],
    ctx: '<p>Le circuit RLC modélise un filtre, un circuit d\'accord, la mise sous tension d\'une ligne ou d\'un moteur (surtension transitoire). En automatique, la même équation décrit un système asservi du second ordre : dépassement, temps de réponse et pseudo-période sont ses critères de performance.</p><p><b>Limites du modèle :</b> la résistance R regroupe celle de la bobine et du circuit ; composants supposés linéaires.</p>',
    src: '<i>circuits en régime transitoire</i>, §IV.2 ; <i>Chapitre09 Oscillateurs harmoniques amortis</i>, §1.1.1 et §2.2 ; <i>09_equations_differentielles_physique</i>, §4.3 et §4.4.3 ; cours MOD06 Ordre 2, « Circuit RLC série ».',
    draw: (c, W, H, st) => {

/* =========================================================================
   9. Oscillations forcées et résonance
   ========================================================================= */
const mForce = (() => {
  const F0 = (p, w) => p.exc === 'balourd' ? p.U / 1000 * w * w : p.F0;
  const amp = (p, w) => F0(p, w) / Math.hypot(p.k - p.m * w * w, p.f * w);
  const parts = p => { const w = p.w, F = F0(p, w), a = p.k - p.m * w * w, b = p.f * w;
    let xp, vp;
    if (Math.abs(a) < 1e-9 * p.k && p.f === 0) { const c0 = F / (2 * p.m * w); xp = t => c0 * t * Math.sin(w * t); vp = t => c0 * (Math.sin(w * t) + w * t * Math.cos(w * t)); }
    else { const X = F / Math.hypot(a, b), ph = Math.atan2(b, a); xp = t => X * Math.cos(w * t - ph); vp = t => -X * w * Math.sin(w * t - ph); }
    const xh = sol2(p.m, p.f, p.k, 0, -xp(0), -vp(0)); return {xp, vp, xh}; };
  return {
    id: 'force', label: 'Machine sur plots élastiques : oscillations forcées et résonance', tUnit: {lab: 's', f: 1}, tSec: 1, tcLab: 'T₀',
    params: [
      {id: 'exc', sym: 'Excitation', opts: [['force', 'Force F₀ cos(ωt)'], ['balourd', 'Balourd tournant : F₀ = U ω²']], val: 'force', refit: true},
      {id: 'm', sym: '$m$', name: 'masse de la machine', unit: 'kg', min: 0.5, max: 5, step: 0.1, val: 1},
      {id: 'k', sym: '$k$', name: 'raideur des plots', unit: 'N/m', min: 20, max: 500, step: 5, val: 100},
      {id: 'f', sym: '$f$', name: 'amortissement des plots', unit: 'N·s/m', min: 0, max: 20, step: 0.1, val: 1},
      {id: 'F0', sym: '$F_0$', name: 'amplitude de la force', unit: 'N', min: 0, max: 10, step: 0.1, val: 2, show: p => p.exc === 'force'},
      {id: 'U', sym: '$U = m_e\\,e$', name: 'balourd', unit: 'g·m', min: 1, max: 50, step: 1, val: 20, show: p => p.exc === 'balourd'},
      {id: 'w', sym: '$\\omega$', name: 'pulsation d\'excitation', unit: 'rad/s', min: 1, max: 30, step: 0.1, val: 8}
    ],
    options: [{id: 'comp', label: 'Afficher régime permanent et régime transitoire séparément', val: false}],
    presets: [
      {label: 'ω = 0,8 ω₀', fn: p => ({w: Number((0.8 * Math.sqrt(p.k / p.m)).toFixed(2))})},
      {label: 'Résonance ω = ω₀', fn: p => ({w: Number(Math.sqrt(p.k / p.m).toFixed(4))})},
      {label: 'ω = 2 ω₀', fn: p => ({w: Number((2 * Math.sqrt(p.k / p.m)).toFixed(2))})},
      {label: 'Battements (f = 0, ω = 0,9 ω₀)', fn: p => ({f: 0, w: Number((0.9 * Math.sqrt(p.k / p.m)).toFixed(4))})},
      {label: 'Résonance sans frottement', fn: p => ({f: 0, w: Math.sqrt(p.k / p.m)})}
    ],
    y0: () => [0, 0],
    f: (t, y, p) => [y[1], (F0(p, p.w) * Math.cos(p.w * t) - p.f * y[1] - p.k * y[0]) / p.m],
    exact: p => { const {xp, vp, xh} = parts(p); return t => { const h = xh(t); return [xp(t) + h[0], vp(t) + h[1]]; }; },
    outs: [
      {id: 'x', lab: 'x : déplacement de la machine', sym: 'x', unit: 'cm', get: (t, y) => 100 * y[0]},

    $('options').addEventListener('change', e => { const id = e.target.dataset.id; if (!id) return; this.o[id] = e.target.checked; this.compute(); this.expand(); this.renderEq(); this.renderCarac(); });
    $('wModele').addEventListener('change', e => this.loadModel(this.tab.models[+e.target.value]));
    $('bPlay').onclick = () => this.togglePlay();
    $('bReset').onclick = () => { this.t = 0; this.flow = 0; this.playing = false; this.renderToolbar(); this.dirty = true; };
    $('sVit').onchange = e => { this.speed = Number(e.target.value); };
    $('sVue').onchange = e => { this.view = e.target.value; if (this.view !== 'temps') { this.mes.on = false; this.hover = null; } if (this.view === 'resonance' || this.view === 'energie') this.eul.on = false;
      if (this.view === 'resonance' && this.fam.on) { const i = (this.m.fam || []).findIndex(f => f.reso); if (i >= 0) this.fam.idx = i; }
      this.renderSelects(); this.renderToolbar(); this.compute(); if (!this.rng[this.key()]) this.fit(); else this.expand(); this.updMes(); };
    $('sSortie').onchange = e => { this.outId = e.target.value; this.compute(); if (!this.rng[this.key()]) this.fit(); else this.expand(); this.updMes(); this.renderEq(); };
    $('bAides').onclick = () => { this.aides = !this.aides; this.renderToolbar(); this.expand(); this.dirty = true; };
    $('bFam').onclick = () => { this.fam.on = !this.fam.on; if (this.fam.on && this.view === 'resonance') { const i = (this.m.fam || []).findIndex(f => f.reso); if (i >= 0) this.fam.idx = i; } this.renderSelects(); this.renderToolbar(); this.compute(); this.expand(); };
    $('sFam').onchange = e => { this.fam.idx = +e.target.value; this.compute(); this.expand(); };
    $('bEuler').onclick = () => { this.eul.on = !this.eul.on; this.renderToolbar(); this.updH(); this.compute(); this.updH(); };
    $('rH').oninput = e => { this.eul.s = e.target.value / 1000; this.compute(); this.updH(); };
    $('bMes').onclick = () => { this.mes.on = !this.mes.on; if (this.mes.on) { this.mes.t1 = 0.25 * this.tView; this.mes.t2 = 0.5 * this.tView; } this.renderToolbar(); this.updMes(); this.dirty = true; };
    $('bDefi').onclick = () => { if (this.defi) this.quitDefi(); else this.startDefi(); };
    $('bZin').onclick = () => { this.tView /= 2; this.t = Math.min(this.t, this.tView); this.compute(); this.expand(); this.clampMes(); };
    $('bZout').onclick = () => { this.tView *= 2; this.compute(); this.expand(); this.clampMes(); };
    $('bFit').onclick = () => { if (!this.defi) this.tView = this.m.tmax(this.p); this.t = Math.min(this.t, this.tView); this.compute(); this.fit(); this.clampMes(); };
    $('bProj').onclick = () => { document.body.classList.toggle('proj'); this.sc = document.body.classList.contains('proj') ? 1.3 : 1; $('bProj').classList.toggle('on', this.sc > 1); this.dirty = true; };
    $('bFull').onclick = () => { if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen; if (r) r.call(document.documentElement).catch(() => {}); } else document.exitFullscreen(); };
    document.addEventListener('keydown', e => {
      const tg = e.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA' || !this.tab) return;
      if (e.key === ' ') { e.preventDefault(); this.togglePlay(); } else if (e.key === 'r' || e.key === 'R') { this.t = 0; this.flow = 0; this.playing = false; this.renderToolbar(); this.dirty = true; }
    });
    const cv = $('cvGraph');
    const gx = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointermove', e => { if (!this.gPlot.box) return; const [px] = gx(e); const x = this.gPlot.invX(px) / this.tf();
      if (this.mes.drag >= 0) { this.setCur(this.mes.drag, x); return; }
      this.hover = (this.view === 'temps' && px >= this.gPlot.box.l && px <= this.gPlot.box.r) ? x : null; this.dirty = true; });
    cv.addEventListener('pointerleave', () => { this.hover = null; this.dirty = true; });
    cv.addEventListener('pointerdown', e => { if (!this.mes.on || this.view !== 'temps' || !this.gPlot.box) return; const [px] = gx(e);
      const d1 = Math.abs(px - this.gPlot.X(this.mes.t1 * this.tf())), d2 = Math.abs(px - this.gPlot.X(this.mes.t2 * this.tf()));
      this.mes.drag = d1 <= d2 ? 1 : 2; cv.setPointerCapture(e.pointerId); this.setCur(this.mes.drag, this.gPlot.invX(px) / this.tf()); });
    const up = () => { this.mes.drag = -1; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  },
  togglePlay() { if (!this.m) return; if (!this.playing && this.t >= this.tView - 1e-12) { this.t = 0; this.flow = 0; } this.playing = !this.playing; this.last = 0; this.renderToolbar(); },
  setCur(i, x) { x = clamp(x, 0, this.tView); if (i === 1) this.mes.t1 = x; else this.mes.t2 = x; this.updMes(); this.dirty = true; },
  clampMes() { this.mes.t1 = Math.min(this.mes.t1, this.tView); this.mes.t2 = Math.min(this.mes.t2, this.tView); this.updMes(); },
  updH() { const h = this.hEuler(); $('rH').value = Math.round(this.eul.s * 1000); const tc = this.m.tc(this.p);
    $('vH').textContent = fmt(h * this.tf(), 3) + ' ' + this.tlab() + ' (' + fmt(h / tc, 2) + ' × ' + (this.m.tcLab || 'τ') + ')';
    $('eErr').textContent = this.euErr === null ? '' : ' · écart max avec la référence : ' + (isFinite(this.euErr) ? fmt(this.euErr, 2) + ' ' + this.out().unit : 'divergence'); },
  updMes() {
    if (!this.mes.on || this.view !== 'temps') { $('mesTxt').innerHTML = ''; return; }
    const o = this.out(), f = this.tf(), u = this.tlab(); const y1 = o.get(this.mes.t1, this.stateAt(this.mes.t1), this.p), y2 = o.get(this.mes.t2, this.stateAt(this.mes.t2), this.p);
    let h = '<b style="color:#E8871E">t₁</b> = ' + fmt(this.mes.t1 * f, 4) + ' ' + u + ' ; ' + htmlSub(o.lab.split(' ')[0]) + ' = ' + fmt(y1, 4) + ' &nbsp; <b style="color:#6B4FA0">t₂</b> = ' + fmt(this.mes.t2 * f, 4) + ' ' + u + ' ; ' + fmt(y2, 4) + ' &nbsp; <b>Δt</b> = ' + fmt(Math.abs(this.mes.t2 - this.mes.t1) * f, 4) + ' ' + u;
    if (y1 * y2 > 0) h += ' &nbsp; <b>ln(y₁/y₂)</b> = ' + fmt(Math.log(y1 / y2), 3);
    $('mesTxt').innerHTML = h;
  },
  /* ---------------- défi ---------------- */
  startDefi() {
    const m = this.m, d = m.defi; if (!d) return;
    this.saved = {p: Object.assign({}, this.p), o: Object.assign({}, this.o), out: this.outId, view: this.view};
    if (d.set) Object.assign(this.p, d.set); if (d.opt) Object.assign(this.o, d.opt);
    for (const id of d.hide) { const q = m.params.find(x => x.id === id); const [a, b] = d.range[id];
      let v = q.log ? a * Math.pow(b / a, Math.random()) : a + Math.random() * (b - a); v = q.log ? Number(v.toPrecision(2)) : Math.round(v / q.step) * q.step; this.p[id] = Number(v.toFixed(6)); }
    this.defi = Object.assign({revealed: false, tries: 0}, d);
    this.aides = false; this.fam.on = false; this.eul.on = false; this.view = 'temps'; if (d.out) this.outId = d.out;
    this.tView = d.tmax ? d.tmax(this.p) : m.tmax(this.p); this.t = 0; this.playing = false; this.mes.on = true; this.mes.t1 = 0.25 * this.tView; this.mes.t2 = 0.5 * this.tView;
    this.renderAll(true); this.updMes();
  },
  checkDefi() {
    const d = this.defi; const v = parseFloat(String($('dIn').value).replace(',', '.').replace(/\s/g, '')); const rep = $('dRep');
    if (!isFinite(v)) { rep.className = 'rep ko'; rep.textContent = 'Entre une valeur numérique.'; return; }
    const a = d.answer(this.p); const err = Math.abs(v - a) / Math.abs(a); d.tries++;
    if (err <= (d.tol || 0.1)) { rep.className = 'rep ok'; rep.innerHTML = 'Bravo. Valeur exacte : ' + fmt(a, 3) + ' ' + esc(d.unit || '') + ' (écart ' + fmt(100 * err, 2) + ' %).'; d.revealed = true; this.renderParams(); this.renderEq(); this.renderCarac(); }
    else { rep.className = 'rep ko'; rep.innerHTML = 'Écart de ' + fmt(100 * err, 2) + ' % : reprends ta mesure.' + (d.tries >= 2 ? ' Clique sur Indice si besoin.' : ''); }
  },
  quitDefi() { if (!this.defi) return; const s = this.saved; this.defi = null; if (s) { this.p = s.p; this.o = s.o; this.outId = s.out; this.view = s.view; }
    this.mes.on = false; this.tView = this.m.tmax(this.p); this.t = 0; this.playing = false; this.renderAll(true); },
  /* ---------------- boucle d'animation ---------------- */
  loop(ts) {
    const dt = this.last ? Math.min(0.1, (ts - this.last) / 1000) : 0; this.last = ts;
    if (this.m && this.tab) {
      if (this.playing) {
        const dts = dt * this.speed / (this.m.tSec || 1); const y = this.stateAt(this.t);
        if (this.m.flowRate) this.flow += this.m.flowRate(this.t, y, this.p) * dts;
        this.t = Math.min(this.tView, this.t + dts); if (this.t >= this.tView) { this.playing = false; this.renderToolbar(); }
        this.dirty = true;
      }
      if (this.dirty) { this.drawAnim(); this.drawGraph(); this.dirty = false; }
    }
    requestAnimationFrame(t2 => this.loop(t2));
  },
  drawAnim() {
    const P = this.aPlot; P.check(); const c = P.ctx; c.setTransform(P.dpr, 0, 0, P.dpr, 0, 0); c.clearRect(0, 0, P.W, P.H);
    c.fillStyle = '#fbfdff'; c.fillRect(0, 0, P.W, P.H);
    const y = this.stateAt(this.t);
    try { this.m.draw(c, P.W, P.H, {t: this.t, y, p: this.p, o: this.o, flow: this.flow, sc: this.sc, app: this}); } catch (err) { console.error(err); }
    $('clock').textContent = 't = ' + fmtFix(this.t * this.tf(), this.t * this.tf() < 10 ? 2 : 1) + ' ' + this.tlab();
  },
  drawGraph() {
    const m = this.m, p = this.p, v = this.view, f = this.tf(), r = this.rng[this.key()] || {y: [0, 1]};
    const static0 = this.t === 0 && !this.playing; const s = {scale: this.sc, series: [], guides: []};
    const bold = (x, y, col, lab, w) => { if (static0) s.series.push({x, y, color: col, w: w || 2.6, lab}); else { s.series.push({x, y, color: col, w: 1.6, alpha: 0.28}); s.series.push({x, y, color: col, w: w || 2.6, upto: this.curX, lab}); } };
    if (v === 'temps') {
      const o = this.out(); const tx = this.ref.t.map(t => t * f); const yy = this.ref.y.map((y, i) => o.get(this.ref.t[i], y, p));
      Object.assign(s, {x0: 0, x1: this.tView * f, y0: r.y[0], y1: r.y[1], xl: 't (' + this.tlab() + ')', yl: o.sym + (o.unit ? ' (' + o.unit + ')' : '')});
      this.curX = this.t * f;
      if (this.aides && m.guides) s.guides = m.guides(p, this.outId, this.o).map(g => Object.assign({}, g, g.x !== undefined ? {x: g.x * f} : {}, g.x1 !== undefined ? {x1: g.x1 * f, x2: g.x2 * f} : {}, g.fn ? {fn: x => g.fn(x / f)} : {}));
      if (this.famData) this.famData.forEach((d, i) => s.series.push({x: d.t.map(t => t * f), y: d.y.map((y, j) => o.get(d.t[j], y, d.p)), color: FAMCOL[i % FAMCOL.length], w: 1.8, lab: d.lab, alpha: 0.9}));
      for (const e of this.extras()) s.series.push({x: this.ref.t.map(t => t * f), y: e.y, color: e.color, w: e.w || 1.8, dash: e.dash, lab: e.lab});
      bold(tx, yy, this.famData ? '#1d2630' : COL.bleu, this.famData ? 'Paramètres actuels' : (this.ref.exact ? 'Solution exacte' : 'Solution numérique (RK4)'));
      if (this.eu) s.series.push({x: this.eu.t.map(t => t * f), y: this.eu.y.map((y, i) => o.get(this.eu.t[i], y, p)), color: COL.rouge, w: 1.4, pts: true, line: true, r: 3, lab: 'Euler'});
      if (!static0) { const st = this.stateAt(this.t); s.marker = {x: this.t * f, y: o.get(this.t, st, p)}; }
      if (this.mes.on) s.cursors = [{x: this.mes.t1 * f, y: o.get(this.mes.t1, this.stateAt(this.mes.t1), p), color: COL.orange, lab: 't₁'}, {x: this.mes.t2 * f, y: o.get(this.mes.t2, this.stateAt(this.mes.t2), p), color: COL.violet, lab: 't₂'}];
      if (this.hover !== null && isFinite(this.hover) && this.mes.drag < 0) { const ht = clamp(this.hover, 0, this.tView); const hy = o.get(ht, this.stateAt(ht), p);
        s.hover = {x: ht * f, y: hy, txt: 't = ' + fmt(ht * f, 3) + ' ' + this.tlab() + ' ; ' + o.lab.split(' ')[0] + ' = ' + fmt(hy, 3) + ' ' + o.unit}; }
    } else if (v === 'phase') {
      const ox = m.outs.find(o => o.id === m.phase.x), oy = m.outs.find(o => o.id === m.phase.y);
      const X = (T, Y, pp) => T.map((t, i) => ox.get(t, Y[i], pp)), Yv = (T, Y, pp) => T.map((t, i) => oy.get(t, Y[i], pp));
      Object.assign(s, {x0: r.x[0], x1: r.x[1], y0: r.y[0], y1: r.y[1], xl: ox.sym + ' (' + ox.unit + ')', yl: oy.sym + ' (' + oy.unit + ')'});
      if (this.famData) this.famData.forEach((d, i) => s.series.push({x: X(d.t, d.y, d.p), y: Yv(d.t, d.y, d.p), color: FAMCOL[i % FAMCOL.length], w: 1.6, lab: d.lab}));
      const xx = X(this.ref.t, this.ref.y, p), yy = Yv(this.ref.t, this.ref.y, p);
      // tracé partiel : on coupe par l'indice temporel
      const k = static0 ? xx.length : Math.max(1, Math.round(this.t / this.tView * (xx.length - 1)) + 1);
      if (!static0) s.series.push({x: xx, y: yy, color: COL.bleu, w: 1.4, alpha: 0.28});
      s.series.push({x: xx.slice(0, k), y: yy.slice(0, k), color: this.famData ? '#1d2630' : COL.bleu, w: 2.6, lab: this.famData ? 'Paramètres actuels' : 'Trajectoire de phase'});
      if (this.eu) s.series.push({x: X(this.eu.t, this.eu.y, p), y: Yv(this.eu.t, this.eu.y, p), color: COL.rouge, w: 1.3, pts: true, line: true, r: 2.6, lab: 'Euler'});
      if (!static0) { const st = this.stateAt(this.t); s.marker = {x: ox.get(this.t, st, p), y: oy.get(this.t, st, p)}; }
    } else if (v === 'energie') {
      const E = this.ref.t.map((t, i) => m.energy(t, this.ref.y[i], p)), u = m.eUnit; const tx = this.ref.t.map(t => t * f); this.curX = this.t * f;
      Object.assign(s, {x0: 0, x1: this.tView * f, y0: r.y[0], y1: r.y[1], xl: 't (' + this.tlab() + ')', yl: 'Énergie (' + u.lab + ')'});
      bold(tx, E.map(e => e.Ec * u.f), COL.orange, m.eLab ? m.eLab[0] : 'Énergie cinétique', 2.2);
      bold(tx, E.map(e => e.Ep * u.f), COL.bleu2, m.eLab ? m.eLab[1] : 'Énergie potentielle', 2.2);
      bold(tx, E.map(e => (e.Ec + e.Ep) * u.f), COL.bleu, m.eLab ? m.eLab[2] : 'Énergie mécanique', 3);
    } else if (v === 'resonance') {
      const R = m.reso, wm = r.x ? r.x[1] : R.wmax(p); const ws = []; for (let i = 0; i <= 600; i++) ws.push(wm * i / 600);
      Object.assign(s, {x0: 0, x1: wm, y0: r.y[0], y1: r.y[1], xl: R.xl, yl: R.yl});
      if (this.famData) this.famData.forEach((d, i) => s.series.push({x: ws, y: ws.map(w => R.amp(d.p, w)), color: FAMCOL[i % FAMCOL.length], w: 1.8, lab: d.lab}));
      s.series.push({x: ws, y: ws.map(w => R.amp(p, w)), color: this.famData ? '#1d2630' : COL.bleu, w: 2.8, lab: this.famData ? 'Paramètres actuels' : 'Amplitude du régime permanent'});
      s.guides = R.guides ? R.guides(p) : [];
      const wc = R.cur(p); s.marker = {x: wc, y: R.amp(p, wc)};
    }
    this.gPlot.draw(s);
  }
};
window.addEventListener('DOMContentLoaded', () => App.init());

</script>
